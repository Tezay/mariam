# Development fixtures, each overridable from a root `.env` (see .env.example).
# This file is public: it must never carry a real credential.
x-backend-env: &backend-env
  FLASK_APP: run.py
  FLASK_ENV: development
  DEFAULT_ORG_SLUG: ${DEFAULT_ORG_SLUG:-demo}
  DATABASE_URL: postgresql://mariam:mariam_secret@db:5432/mariam_db
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-secret-key-change-in-production}
  JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-30}
  MFA_ISSUER_NAME: MARIAM
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  WEBAUTHN_RP_ID: localhost
  WEBAUTHN_RP_NAME: MARIAM
  WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-https://localhost:5173}
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY_ID: mariam_minio
  S3_SECRET_ACCESS_KEY: mariam_minio_secret
  S3_BUCKET_NAME: mariam-uploads
  S3_REGION: us-east-1
  S3_PUBLIC_URL: http://localhost:9000/mariam-uploads
  # No default on purpose: push stays off until a developer generates a pair.
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_CONTACT_EMAIL: ${VAPID_CONTACT_EMAIL:-admin@mariam.dev}

services:
  db:
    image: postgres:15-alpine
    container_name: mariam_db
    environment:
      POSTGRES_USER: mariam
      POSTGRES_PASSWORD: mariam_secret
      POSTGRES_DB: mariam_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mariam -d mariam_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: mariam_minio
    environment:
      MINIO_ROOT_USER: mariam_minio
      MINIO_ROOT_PASSWORD: mariam_minio_secret
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mariam_redis
    # Every key we store carries a TTL; volatile-ttl evicts the oldest of those
    # under pressure, where allkeys-* could drop a lock or a revoked token.
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-ttl
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mariam_backend
    environment:
      <<: *backend-env
      FLASK_DEBUG: 1
      # Jobs run once, in the scheduler service; a second runner would duplicate
      # every push notification.
      ENABLE_SCHEDULER: 0
    volumes:
      - ./server:/app
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: flask run --host=0.0.0.0 --port=5000 --reload

  scheduler:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mariam_scheduler
    environment:
      <<: *backend-env
      # No FLASK_DEBUG here: in debug mode the scheduler defers to the reloader's
      # child process, which this entrypoint never spawns, and no job would run.
      ENABLE_SCHEDULER: 1
    volumes:
      - ./server:/app
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    entrypoint: ["python", "scheduler.py"]

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: mariam_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: /v1
      API_PROXY_TARGET: http://backend:5000
    volumes:
      - ./client:/app
      # Keeps the image's node_modules, which the bind mount above would shadow.
      - /app/node_modules
      - ./certs:/certs:ro
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: bun run dev --host 0.0.0.0

volumes:
  postgres_data:
  redis_data:
  minio_data:

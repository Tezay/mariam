# Images are built by CI and pulled here rather than built on the server, so a
# deploy cannot fail on a missing toolchain and a rollback is a tag change.
# No port is published: route the hosts to the proxy service, or publish its
# port in compose.override.yaml.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-env: &backend-env
  # Container clock on the business timezone: logs, cron triggers and any
  # stray date.today() then agree with what the app computes explicitly.
  TZ: Europe/Paris
  DATABASE_URL: postgresql://${POSTGRES_USER:-mariam}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mariam_db}
  SECRET_KEY: ${SECRET_KEY:?}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?}
  JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-30}
  MFA_ISSUER_NAME: ${MFA_ISSUER_NAME:-MARIAM}
  # Fernet key encrypting TOTP secrets at rest. Losing it = MFA reset for all users.
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
  API_URL: ${API_URL:-}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-mariam-uploads}
  S3_REGION: ${S3_REGION:?}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?}
  VAPID_CONTACT_EMAIL: ${VAPID_CONTACT_EMAIL:-contact@mariam.app}
  REDIS_URL: ${REDIS_URL:?}
  ORG_CACHE_TTL_SECONDS: ${ORG_CACHE_TTL_SECONDS:-60}
  PUBLIC_RATE_LIMIT: "${PUBLIC_RATE_LIMIT:-600 per minute}"
  TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-1}
  TELEMETRY_RETENTION_DAYS: ${TELEMETRY_RETENTION_DAYS:-400}
  AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-180}
  TELEMETRY_VISITOR_DAILY_CAP: ${TELEMETRY_VISITOR_DAILY_CAP:-120}
  TELEMETRY_IP_DAILY_CAP: ${TELEMETRY_IP_DAILY_CAP:-50000}
  TELEMETRY_IP_UNIQUE_CAP: ${TELEMETRY_IP_UNIQUE_CAP:-5000}
  DEVICE_ID_SECRET: ${DEVICE_ID_SECRET:?}
  VOTE_IP_DAILY_CAP: ${VOTE_IP_DAILY_CAP:-3000}
  VOTE_DEVICE_MINT_PER_HOUR: ${VOTE_DEVICE_MINT_PER_HOUR:-2000}
  ALERT_INACTIVE_DAYS: ${ALERT_INACTIVE_DAYS:-7}
  ALERT_MIN_VIEWS: ${ALERT_MIN_VIEWS:-50}
  ALERT_TRAFFIC_DROP_PCT: ${ALERT_TRAFFIC_DROP_PCT:-0.5}
  ALERT_MIN_VOTES: ${ALERT_MIN_VOTES:-30}
  ALERT_LOW_SCORE: ${ALERT_LOW_SCORE:-1.8}
  ALERT_VOTE_ANOMALY_RATIO: ${ALERT_VOTE_ANOMALY_RATIO:-1.5}
  EMAIL_LOCALE: ${EMAIL_LOCALE:-fr}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_SENDER: ${SMTP_SENDER:-}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
  SMTP_TLS: ${SMTP_TLS:-1}
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?}
  WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-MARIAM}
  WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  BASE_DOMAIN: ${BASE_DOMAIN:-mariam.app}
  DEFAULT_ORG_SLUG: ${DEFAULT_ORG_SLUG:-}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mariam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-mariam_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mariam} -d ${POSTGRES_DB:-mariam_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/tezay/mariam-backend}:${MARIAM_TAG:?}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    environment:
      <<: *backend-env
      # Jobs run once, in the scheduler service; a second runner would duplicate
      # every push notification.
      ENABLE_SCHEDULER: "0"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)" ]
      interval: 30s
      timeout: 5s
      retries: 3
      # A first start on an empty database runs every migration.
      start_period: 3m
      start_interval: 5s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 320m
    cpus: 0.5
    # Every key we store carries a TTL; volatile-ttl evicts the oldest of those
    # under pressure, where allkeys-* could drop a lock or a revoked token.
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-ttl
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    image: ${BACKEND_IMAGE:-ghcr.io/tezay/mariam-backend}:${MARIAM_TAG:?}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.5
    entrypoint: ["python", "scheduler.py"]
    environment:
      <<: *backend-env
      ENABLE_SCHEDULER: "1"
    depends_on:
      backend:
        condition: service_healthy  # ensures migrations have run

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/tezay/mariam-frontend}:${MARIAM_TAG:?}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    cpus: 0.5
    environment:
      API_URL: ${API_URL:-/v1}
      API_INTERNAL_URL: http://backend:5000/v1
      CANONICAL_HOST: ${CANONICAL_HOST:-}
      UMAMI_SCRIPT_URL: ${UMAMI_SCRIPT_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:-}
      SENTRY_DSN: ${FRONTEND_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    depends_on:
      backend:
        condition: service_healthy

  proxy:
    image: ${PROXY_IMAGE:-ghcr.io/tezay/mariam-proxy}:${MARIAM_TAG:?}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    cpus: 0.25
    environment:
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      REAL_IP_HEADER: ${REAL_IP_HEADER:-}
    depends_on:
      frontend:
        condition: service_healthy

  backup:
    image: ${BACKUP_IMAGE:-ghcr.io/tezay/mariam-backup}:${MARIAM_TAG:?}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.5
    environment:
      TZ: Europe/Paris
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-mariam}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-mariam_db}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data_prod:
  redis_data:

# Builds the images, deploys them to staging, then to production once approved
# (docs/OPERATIONS.md, "Continuous delivery").
name: Delivery

on:
  push:
    branches: [main]
    tags: ['v*']
    # Ignored for tags: GitHub does not evaluate path filters on a tag push.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  quality:
    name: Quality gates
    uses: ./.github/workflows/quality.yml
    # quality.yml asks for pull-requests: read, and a called workflow gets no more than this.
    permissions:
      contents: read
      pull-requests: read

  # A release candidate is tagged before the commit that names its version.
  release:
    name: Tag names the release
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: client/package.json and CHANGELOG.md name this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$(jq -r .version client/package.json)" = "$version" ] \
            || { echo "::error::client/package.json is not at $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no [$version] section"; exit 1; }

  build:
    name: Publish ${{ matrix.component }} image
    needs: [quality, release]
    if: ${{ !cancelled() && needs.quality.result == 'success' && needs.release.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - component: backend
            context: ./server
            file: Dockerfile.prod
          - component: frontend
            context: ./client
            file: Dockerfile.prod
          - component: backup
            context: ./deploy/backup
            file: Dockerfile
          - component: proxy
            context: ./deploy/nginx
            file: Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=main-,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.file }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same source as the image tag, so the two cannot drift apart.
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          # A cached layer would keep the system packages of the day it was built.
          no-cache-filters: runtime

      - name: Sign the provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}

  staging:
    name: Deploy to staging
    needs: build
    # A skipped job skips every job after it: on main, the release check is skipped.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ vars.BASE_URL }}
    # Queued rather than cancelled: a deploy stopped halfway leaves the instance unchecked.
    concurrency:
      group: staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      attestations: read
    outputs:
      images: ${{ steps.promote.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=main-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Point staging at the images
        id: promote
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          images=$(./deploy/scripts/promote-images.sh staging \
            "backend=$VERSION" "frontend=$VERSION" "backup=$VERSION" "proxy=$VERSION")
          echo "images=$(echo "$images" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          {
            echo "### Staging runs $VERSION"
            echo '```'
            echo "$images"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          DEPLOY_HOOK_HEADERS: ${{ secrets.DEPLOY_HOOK_HEADERS }}
        run: |
          printf '%s\n' "$DEPLOY_HOOK_HEADERS" > "$RUNNER_TEMP/hook-headers"
          # curl takes an access control's redirect to its login page for a success.
          code=$(curl -sS -o "$RUNNER_TEMP/hook-response" -w '%{http_code}' \
            -X POST -H "@$RUNNER_TEMP/hook-headers" "$DEPLOY_HOOK_URL")
          cat "$RUNNER_TEMP/hook-response"; echo
          [ "$code" = 200 ] || { echo "::error::The deploy hook answered $code."; exit 1; }

      - name: Access headers
        env:
          SMOKE_HEADERS: ${{ secrets.SMOKE_HEADERS }}
        run: |
          if [ -n "$SMOKE_HEADERS" ]; then
            printf '%s\n' "$SMOKE_HEADERS" > "$RUNNER_TEMP/smoke-headers"
            echo "SMOKE_HEADERS_FILE=$RUNNER_TEMP/smoke-headers" >> "$GITHUB_ENV"
          fi

      - name: Smoke test
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          VERSION: ${{ steps.version.outputs.version }}
        run: ./deploy/scripts/smoke-test.sh "$BASE_URL" "$VERSION"

      - name: Baseline scan
        env:
          BASE_URL: ${{ vars.BASE_URL }}
        run: ./deploy/scripts/baseline-scan.sh "$BASE_URL"

  production:
    name: Deploy to production
    needs: staging
    if: >-
      ${{ !cancelled() && needs.staging.result == 'success'
      && github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.BASE_URL }}
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      attestations: read
    steps:
      # The workflow token may never write under .github/workflows/, as moving this branch can.
      - name: Token to move the production branch
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point production at the images staging was checked on
        env:
          IMAGES: ${{ needs.staging.outputs.images }}
          SOURCE_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2086 # one COMPONENT=DIGEST argument per word
          ./deploy/scripts/promote-images.sh production $IMAGES

      # The instance reads its compose file from this branch.
      - name: Move the production branch to the release
        run: git push origin "$GITHUB_SHA:refs/heads/production"

      - name: Deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          DEPLOY_HOOK_HEADERS: ${{ secrets.DEPLOY_HOOK_HEADERS }}
        run: |
          printf '%s\n' "$DEPLOY_HOOK_HEADERS" > "$RUNNER_TEMP/hook-headers"
          # curl takes an access control's redirect to its login page for a success.
          code=$(curl -sS -o "$RUNNER_TEMP/hook-response" -w '%{http_code}' \
            -X POST -H "@$RUNNER_TEMP/hook-headers" "$DEPLOY_HOOK_URL")
          cat "$RUNNER_TEMP/hook-response"; echo
          [ "$code" = 200 ] || { echo "::error::The deploy hook answered $code."; exit 1; }

      - name: Smoke test
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          SMOKE_HEADERS: ${{ secrets.SMOKE_HEADERS }}
        run: |
          if [ -n "$SMOKE_HEADERS" ]; then
            printf '%s\n' "$SMOKE_HEADERS" > "$RUNNER_TEMP/smoke-headers"
            export SMOKE_HEADERS_FILE="$RUNNER_TEMP/smoke-headers"
          fi
          ./deploy/scripts/smoke-test.sh "$BASE_URL" "${GITHUB_REF_NAME#v}"

# Outside the release gate on purpose: an advisory published overnight must not
# stand between a hotfix and production.
name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # GitHub's dependency graph does not read bun.lock, so nothing else watches
  # these packages.
  frontend:
    name: Frontend dependencies (bun audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: client
        run: bun install --frozen-lockfile

      # lodash ships inside recharts 2 and no release of lodash fixes it; the
      # recharts 3 upgrade is what clears this.
      - name: Audit
        working-directory: client
        run: bun audit --prod --audit-level=high --ignore GHSA-r5fr-rjxr-66jc

  backend:
    name: Backend dependencies (uv audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # No install step: --frozen audits uv.lock directly. Still a preview
      # command — if uv changes it, pip-audit is the stable fallback.
      - name: Audit
        working-directory: server
        run: uv audit --frozen --preview-features audit

# Outside the release gate on purpose: an advisory published overnight must not
# stand between a hotfix and production.
name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # paths-filter lists a pull request's files through the API.
  pull-requests: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
      images: ${{ steps.decide.outputs.images }}
      api: ${{ steps.decide.outputs.api }}
    steps:
      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'server/pyproject.toml'
              - 'server/uv.lock'
              - '.github/workflows/security.yml'
            frontend:
              - 'client/package.json'
              - 'client/bun.lock'
              - '.github/workflows/security.yml'
            images:
              - '**/Dockerfile*'
              - '.github/workflows/security.yml'
            api:
              - 'deploy/zap/**'
              - 'deploy/scripts/api-scan.sh'
              - '.github/workflows/security.yml'

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          IMAGES: ${{ steps.filter.outputs.images }}
          API: ${{ steps.filter.outputs.api }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            mode=filtered
          else
            mode=full BACKEND=true FRONTEND=true IMAGES=true API=true
          fi
          for value in "$BACKEND" "$FRONTEND" "$IMAGES" "$API"; do
            if [ "$value" != true ] && [ "$value" != false ]; then
              echo "::error::A path filter gave no decision in $mode mode."
              exit 1
            fi
          done
          {
            echo "backend=$BACKEND"
            echo "frontend=$FRONTEND"
            echo "images=$IMAGES"
            echo "api=$API"
          } >> "$GITHUB_OUTPUT"

          row() {
            if [ "$2" = true ]; then echo "| $1 | runs | $3 |"; else echo "| $1 | skipped | $3 |"; fi
          }
          {
            echo "### Change detection: \`$mode\`"
            echo
            if [ "$mode" = filtered ]; then
              echo "An audit runs only when its manifest or lockfile changes, and the image scan when a Dockerfile does: a skipped job was not run, not passed. The weekly run checks everything."
            else
              echo "Scheduled or manual run: both lockfiles are audited, and the production images scanned."
            fi
            echo
            echo "| Audit | Decision | Triggered by |"
            echo "|---|---|---|"
            row "Backend (uv audit)" "$BACKEND" "\`server/pyproject.toml\`, \`server/uv.lock\`"
            row "Frontend (bun audit)" "$FRONTEND" "\`client/package.json\`, \`client/bun.lock\`"
            row "Images (Trivy)" "$IMAGES" "a \`Dockerfile\`"
            row "API (ZAP)" "$API" "\`deploy/zap/\`, \`deploy/scripts/api-scan.sh\`"
            echo
            echo "A change to this workflow runs every row."
          } >> "$GITHUB_STEP_SUMMARY"

  # Runtime dependencies only: the build toolchain is out of scope. GitHub's
  # dependency graph does not read bun.lock, so nothing else watches these.
  frontend:
    name: Frontend dependencies (bun audit)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # No install step: bun audit reads bun.lock.
      - name: Audit
        working-directory: client
        run: bun audit --prod --audit-level=moderate

  backend:
    name: Backend dependencies (uv audit)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # No install step: --frozen audits uv.lock directly. Still a preview
      # command — if uv changes it, pip-audit is the stable fallback.
      - name: Audit
        working-directory: server
        run: uv audit --frozen --preview-features audit

  # System packages only: uv audit and bun audit cover the libraries.
  images:
    name: ${{ matrix.component }} image (Trivy)
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./server
            file: Dockerfile.prod
          - component: frontend
            context: ./client
            file: Dockerfile.prod
          - component: backup
            context: ./deploy/backup
            file: Dockerfile
          - component: proxy
            context: ./deploy/nginx
            file: Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.file }}
          push: false
          load: true
          platforms: linux/amd64
          tags: mariam-${{ matrix.component }}:scan
          cache-from: type=gha,scope=${{ matrix.component }}
          no-cache-filters: runtime

      - name: Image to scan
        id: image
        env:
          EVENT: ${{ github.event_name }}
          COMPONENT: ${{ matrix.component }}
          PUBLISHED: ghcr.io/${{ github.repository }}-${{ matrix.component }}:production
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "ref=mariam-$COMPONENT:scan" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${PUBLISHED,,}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          vuln-type: os
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'

  api:
    name: API (ZAP active scan)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mariam
          POSTGRES_PASSWORD: mariam_secret
          POSTGRES_DB: mariam_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
    env:
      DATABASE_URL: postgresql://mariam:mariam_secret@localhost:5432/mariam_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key
      JWT_SECRET_KEY: ci-jwt-secret-key
      FLASK_APP: run.py
      FLASK_ENV: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install the backend
        working-directory: server
        run: uv sync --no-dev --no-install-project --frozen

      - name: Seed the demo organization
        working-directory: server
        run: |
          uv run flask db upgrade
          uv run flask seed-demo

      # The scan would spend the rate limits within a minute; the tests turn them off the same way.
      - name: Start the API
        working-directory: server
        run: |
          nohup uv run python -c 'from app import create_app; from app.security import limiter; app = create_app(); limiter.enabled = False; app.run(port=5000, threaded=True)' > /dev/null 2>&1 &
          for _ in $(seq 1 30); do
            curl -fs http://localhost:5000/health >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Scan
        run: ./deploy/scripts/api-scan.sh http://localhost:5000

  result:
    name: Security result
    needs: [changes, frontend, backend, images, api]
    # always(), not !cancelled(): a required check that is skipped counts as passed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail on a failed or cancelled job
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::An audit or a scan failed or was cancelled; see the jobs above."
          exit 1

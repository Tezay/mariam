# Outside the release gate on purpose: an advisory published overnight must not
# stand between a hotfix and production.
name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runtime dependencies only: the build toolchain is out of scope. GitHub's
  # dependency graph does not read bun.lock, so nothing else watches these.
  frontend:
    name: Frontend dependencies (bun audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # No install step: bun audit reads bun.lock. None of these four has a fix
      # in the majors we run — lodash leaves with recharts 3, router with v7.
      - name: Audit
        working-directory: client
        run: >
          bun audit --prod --audit-level=moderate
          --ignore GHSA-r5fr-rjxr-66jc
          --ignore GHSA-f23m-r3pf-42rh
          --ignore GHSA-337j-9hxr-rhxg
          --ignore GHSA-wrjc-x8rr-h8h6

  backend:
    name: Backend dependencies (uv audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # No install step: --frozen audits uv.lock directly. Still a preview
      # command — if uv changes it, pip-audit is the stable fallback.
      - name: Audit
        working-directory: server
        run: uv audit --frozen --preview-features audit

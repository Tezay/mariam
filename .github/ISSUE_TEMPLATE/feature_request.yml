name: Feature request
description: Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Which need or frustration would this feature address?
      placeholder: "As a menu manager, I cannot… which forces me to…"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you would like
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you thought of other approaches?
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Estimated priority
      options:
        - Critical (blocks users)
        - High (significant impact)
        - Medium (useful improvement)
        - Low (nice to have)
    validations:
      required: true

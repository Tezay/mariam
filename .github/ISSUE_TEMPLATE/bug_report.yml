name: Bug report
description: Report something that does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: As /health reports it, or the latest entry of CHANGELOG.md
      placeholder: "e.g. v0.11.1"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: "e.g. Chrome 124, Safari on iPhone 15, Samsung Tizen TV"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happens instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to…
        2. Click…
        3. See…
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, console logs, anything that helps
    validations:
      required: false

{# Shared shell for every email. Language-neutral: wording lives in the locale files. #}
<!doctype html>
<html lang="{{ locale }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
  </head>
  <body style="margin:0;background:#f1f5f9;padding:24px 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif;color:#0f172a">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr><td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:100%;background:#ffffff;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden">
          <tr>
            <td style="padding:18px 24px;background:#093EAA">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
                <td style="font-size:16px;font-weight:700;color:#ffffff;letter-spacing:.01em">Mariam</td>
                <td style="text-align:right;font-size:12px;color:#c7d7f5">{% block kicker %}{% endblock %}</td>
              </tr></table>
            </td>
          </tr>
          <tr>
            <td style="padding:22px 24px 26px;font-size:14px;line-height:1.5">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 24px;background:#f8fafc;border-top:1px solid #e2e8f0;font-size:12px;line-height:1.6;color:#64748b">
              {% block footer %}{% endblock %}
            </td>
          </tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
